<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d1a"><title>Угадай, чей мем?</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f9f5ff;background:#100d1a;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#453067 0%,transparent 55%),#100d1a}main{max-width:1040px;margin:auto;padding:24px 18px 80px}h1{font-size:clamp(35px,8vw,66px);letter-spacing:-.06em;margin:10px 0}h2{font-size:25px;letter-spacing:-.03em}p{line-height:1.5;color:#bfb5d0}.logo{font-size:45px}.eyebrow{letter-spacing:.19em;color:#c2a5fd;font-weight:800;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#201b2e;border:1px solid #433652;border-radius:24px;padding:24px;margin-top:18px}.center{text-align:center}.accent{color:#d5b1ff}.muted{color:#aa9ebc}.roomcode{font-size:40px;font-weight:950;letter-spacing:.16em;color:#eacbff}.hint{font-size:13px;color:#aca0bd}input[type=text]{width:100%;background:#130f20;color:white;border:1px solid #5b4b6d;padding:14px;border-radius:13px;font-size:16px;margin:8px 0 12px}button{border:0;border-radius:13px;background:#d5aaff;color:#22112b;font:inherit;font-weight:800;padding:13px 18px;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.38;cursor:not-allowed}button.secondary{background:#392f4c;color:white}button.danger{background:#e178ae;color:#22091e}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border-radius:20px;background:#352945;padding:8px 12px;font-size:13px}.cardimg{display:block;margin:auto;max-width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#130e1c}.arena{min-width:0;text-align:center;padding:22px;background:#211b2e;border-radius:25px;border:1px solid #57446a}.pick{width:100%;background:#382c4d;color:white;text-align:left;margin:5px 0}.pick.selected{background:#c9a0ff;color:#191223}.result{padding:14px;border-radius:14px;background:#342743;margin:7px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.gallery{display:flex;gap:9px;flex-wrap:wrap}.thumb{position:relative}.thumb img{width:88px;height:88px;object-fit:cover;border-radius:10px}.tag{padding:4px 8px;border-radius:10px;background:#8152bb;color:white;font-size:11px}.upload{border:2px dashed #685282;border-radius:20px;padding:20px;display:block;cursor:pointer;text-align:center;margin:14px 0}input[type=file]{display:none}label.toggle{display:block;margin:10px 0;color:#e6daf3}.notice{position:fixed;bottom:20px;right:20px;max-width:90vw;background:#f4d3ed;color:#34152c;padding:15px 20px;border-radius:16px;box-shadow:0 20px 50px #0007;z-index:10}.thumb{display:flex;flex-direction:column;align-items:center;gap:4px}.thumb img{cursor:zoom-in}.thumb button{font-size:12px;padding:7px 9px;margin:2px}.lightbox{position:fixed;inset:0;background:#090511ee;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:14px}.lightbox img{object-fit:contain;max-width:96vw;max-height:85vh}.lightbox button{align-self:flex-end}.scoreline{display:flex;gap:8px;justify-content:space-between;align-items:center}ol li{margin:12px 0}.hidden{display:none}@media(max-width:720px){.game-grid{grid-template-columns:minmax(0,1fr)!important}.cardimg{width:100%;height:auto;max-height:68vh;object-fit:contain}.grid{grid-template-columns:1fr}.panel{padding:18px}.roomcode{font-size:30px}.arena{padding:12px}main{padding:18px 12px 65px}}
</style></head><body><main><div class="eyebrow">ВЕЧЕРИНКА С СОМНИТЕЛЬНЫМ ЮМОРОМ</div><h1>Угадай, <span class="accent">чей мем?</span> 🫠</h1><p id="subtitle">Загружайте любимые мемы тайно. Голосуйте с телефонов. Узнайте, кто тут самый странный.</p><div id="app"></div></main><div id="toast" class="notice hidden"></div><div id="viewer" class="lightbox hidden"><button class="secondary" id="closeviewer">✕ Закрыть</button><img id="viewerimg" alt="Мем крупно"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const app=document.querySelector('#app');const saved=JSON.parse(localStorage.getItem('memeSession')||'null');let state=null,session=saved,choice=null,stake=false,displayOnly=new URLSearchParams(location.search).has('display');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const act=(type,more={})=>socket.emit(type,{...session,...more});
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4500)}
socket.on('notice',e=>toast(e.error||'Ошибка'));
socket.on('connect',()=>{if(session)socket.emit('join',session,res=>{if(res.error){toast(res.error);session=null;localStorage.removeItem('memeSession');renderHome()}else{session={...session,...res};localStorage.setItem('memeSession',JSON.stringify(session))}});});
socket.on('state',s=>{if(state?.index!==s.index||state?.mode!==s.mode||state?.phase!==s.phase){choice=null;stake=false;}state=s;render()});
function openViewer(src){const v=document.querySelector('#viewer');document.querySelector('#viewerimg').src=src;v.classList.remove('hidden')}
document.querySelector('#closeviewer').onclick=()=>document.querySelector('#viewer').classList.add('hidden');
document.querySelector('#viewer').addEventListener('click',e=>{if(e.target.id==='viewer')e.currentTarget.classList.add('hidden')});
function viewerBindings(){document.querySelectorAll('img[data-zoom]').forEach(el=>el.addEventListener('click',()=>openViewer(el.src)));}
function renderHome(){app.innerHTML=`<div class="grid"><section class="panel"><h2>🎩 Создать комнату</h2><p>Ты будешь ведущим. Мемы можно вывести на телевизор или ноутбук.</p><input id="newname" type="text" maxlength="24" placeholder="Твой ник"><button id="create">Создать игру</button></section><section class="panel"><h2>🚪 Войти к друзьям</h2><input id="code" type="text" maxlength="6" placeholder="Код комнаты" value="${escapeHTML(new URLSearchParams(location.search).get('room')||'')}"><input id="name" type="text" maxlength="24" placeholder="Твой ник"><button id="join">Присоединиться</button></section></div><div class="panel"><h2>Как играть?</h2><p>3–5 человек, по 1–10 мемов. Ведущий выбирает режим, друзья голосуют, автор раскрывается, очки считаются автоматически.</p></div>`;document.querySelector('#create').onclick=()=>{socket.emit('create',{name:document.querySelector('#newname').value},enter)};document.querySelector('#join').onclick=()=>socket.emit('join',{code:document.querySelector('#code').value,name:document.querySelector('#name').value},enter);}
function enter(res){if(res.error)return toast(res.error);session=res;localStorage.setItem('memeSession',JSON.stringify(session));history.replaceState({},'', '?room='+res.code);}
function people(){return `<div class="chips">${state.players.map(p=>`<span class="chip">${p.online?'🟢':'⚪'} ${escapeHTML(p.name)} · ${p.uploaded} шт.</span>`).join('')}</div>`}
function header(){return `<div class="panel"><div class="row"><div><span class="muted">КОМНАТА</span><div class="roomcode">${state.code}</div></div><div><button class="secondary" id="share">🔗 Ссылка</button>${state.isHost?`<button class="secondary" id="display">📺 Экран</button>`:''}</div></div>${people()}</div>`}
function controls(){document.querySelector('#share')?.addEventListener('click',()=>navigator.clipboard?.writeText(location.origin+'/?room='+state.code).then(()=>toast('Ссылка скопирована')).catch(()=>toast('Скопируй адрес страницы')));document.querySelector('#display')?.addEventListener('click',()=>window.open('/?room='+state.code+'&display=1','_blank'));}
function lobby(){app.innerHTML=header()+`<div class="grid"><section class="panel"><h2>📥 Загрузи свою дичь</h2><p>Авторство скрыто до раскрытия карточки. GIF сохраняются анимированными. До 6 МБ на файл.</p><label class="upload"><strong>➕ Нажми, чтобы выбрать мемы</strong><p>JPG, PNG, WebP, GIF</p><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label>${state.isHost?`<label class="toggle"><input type="checkbox" id="decoy"> 🎭 Эти файлы — подстава от ведущего (никто не загружал)</label>`:''}<div id="uploadstatus" class="hint"></div><div class="gallery">${state.myCards.map(c=>`<div class="thumb"><img data-zoom src="${c.url}" alt="Твой мем">${c.imposter?'<div class="tag">Подстава</div>':''}<button class="secondary" data-replace="${c.id}">🔁 Заменить</button><button class="danger" data-delete="${c.id}">🗑 Удалить</button></div>`).join('')}</div></section><section class="panel"><h2>🎮 Подготовка</h2><p>Все заходят по ссылке, загружают хотя бы по одному мему, ведущий запускает игру.</p>${state.isHost?`<div>${[['imposter','Мемный самозванец'],['who','Кто бы это сохранил?'],['shame','Анонимный позор'],['stake','Ставка на уверенность']].map(([k,v])=>`<label class="toggle"><input type="checkbox" data-setting="${k}" ${state.settings[k]?'checked':''}> ${v}</label>`).join('')}</div><button id="start" ${state.canStart?'':'disabled'}>🚀 Начать игру</button><p class="hint">Нужно минимум 3 игрока и по одному обычному мему от каждого. Подставные мемы ведущий загружает отдельно.</p>`:'<p class="accent">Ждём, пока ведущий запустит игру.</p>'}</section></div>`;controls();viewerBindings();document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Удалить этот мем?'))act('delete-card',{cardId:b.dataset.delete})});document.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>{const id=b.dataset.replace;const input=document.querySelector('#files');input.dataset.replace=id;input.click();});document.querySelector('#files').onchange=async e=>{const list=[...e.target.files];const el=document.querySelector('#uploadstatus');for(let i=0;i<list.length;i++){const f=list[i];el.textContent=`Загрузка ${i+1}/${list.length}: ${f.name}`;const body=new FormData();body.append('code',session.code);body.append('token',session.token);body.append('imposter',document.querySelector('#decoy')?.checked?'true':'false');if(e.target.dataset.replace)body.append('replaceCardId',e.target.dataset.replace);body.append('file',f);try{const res=await fetch('/api/upload',{method:'POST',body});const data=await res.json();if(!res.ok)toast(data.error||'Не получилось загрузить')}catch{toast('Ошибка сети')}}el.textContent='Загрузка завершена';delete e.target.dataset.replace;e.target.value='';};document.querySelector('#start')?.addEventListener('click',()=>act('start'));document.querySelectorAll('[data-setting]').forEach(e=>e.addEventListener('change',()=>act('settings',{settings:{[e.dataset.setting]:e.checked}})));}
function labelMode(){return ({owner:'Угадай владельца',who:'Кто бы это сохранил?',imposter:'Мемный самозванец'})[state.mode]}
function choices(){return [...state.players.map(p=>({id:p.id,name:p.name})),...(state.mode!=='who'?[{id:'nobody',name:'🎭 Никто из нас — подстава'}]:[])];}
function play(){const c=state.card;const fullscreen=displayOnly;app.innerHTML=header()+`<section class="panel"><div class="row"><div><b>Раунд ${state.index+1}/${state.total}</b><p>Режим: <span class="accent">${labelMode()}</span></p></div><div class="chip">${state.voteCount} голосов</div></div></section><div class="grid game-grid" style="grid-template-columns:${fullscreen?'1fr':'minmax(0,1.4fr) minmax(260px,1fr)'}"><section class="arena"><img class="cardimg" data-zoom src="${c.url}" alt="Мем" title="Нажми, чтобы увеличить"><p class="hint">Автор пока секретный</p></section>${fullscreen?'':`<section class="panel"><h2>🕵️ Твоя версия</h2>${state.voted?'<p class="accent">✅ Голос принят. Ждём раскрытия!</p>':`${choices().map(p=>`<button class="pick ${choice===p.id?'selected':''}" data-pick="${p.id}">${escapeHTML(p.name)}</button>`).join('')}${state.settings.stake&&state.mode!=='who'?`<label class="toggle"><input type="checkbox" id="stake" ${stake?'checked':''}> 🎲 Удвоить ставку (+4 за верный ответ, −1 за неверный)</label>`:''}<button id="sendvote" ${choice?'':'disabled'}>Проголосовать</button>`}${state.isHost?`<hr style="border-color:#4b3b60"><p class="hint">Управление ведущего</p><div class="chips">${[['owner','Владелец'],...(state.settings.who?[['who','Кому подходит?']]:[]),['imposter','Самозванец']].map(([k,v])=>`<button class="secondary" data-mode="${k}">${v}</button>`).join('')}</div><button id="reveal">👀 Раскрыть ответ</button>`:''}</section>`}</div>${fullscreen&&state.isHost?'<div class="panel"><button id="reveal">👀 Раскрыть ответ</button></div>':''}`;controls();viewerBindings();document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{choice=b.dataset.pick;render();});document.querySelector('#stake')?.addEventListener('change',e=>stake=e.target.checked);document.querySelector('#sendvote')?.addEventListener('click',()=>{if(choice)act('vote',{choice,stake})});document.querySelector('#reveal')?.addEventListener('click',()=>act('reveal'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>act('mode',{mode:b.dataset.mode}));}
function scoreDetails(r){return `<h2>🧾 За что начислены очки</h2><p class="hint">Верный ответ +2, уверенная ставка +4 или −1. Владелец получает +1 за каждую ошибочную догадку о его меме в режиме «Владелец». Счёт не уходит ниже нуля.</p>${(r.scores||[]).map(p=>`<div class="result"><div class="row"><strong>${escapeHTML(p.name)}</strong><b>${p.delta>=0?'+':''}${p.delta} очков</b></div><div class="hint">${p.votePoints?`За голос: ${p.votePoints>0?'+':''}${p.votePoints}. `:''}${p.ownerBonus?`Бонус владельца: +${p.ownerBonus} за ошибочные голоса. `:''}${!p.votePoints&&!p.ownerBonus?'Баллы не изменились.':''} Было ${p.before} → стало ${p.after}</div></div>`).join('')}`}
function historyBlock(){return `<details class="panel"><summary style="cursor:pointer;font-weight:800">📜 История раундов (${state.history.length})</summary>${state.history.map(h=>`<div class="result"><b>Раунд ${h.round}: ${escapeHTML(h.ownerName)}</b><div class="hint">${escapeHTML(h.mode)}</div>${h.scores.map(p=>`<div>${escapeHTML(p.name)}: ${p.delta>=0?'+':''}${p.delta} (${p.before} → ${p.after})</div>`).join('')}</div>`).join('')}</details>`}
function reveal(){const r=state.results;app.innerHTML=header()+`<div class="grid"><section class="arena"><img class="cardimg" data-zoom src="${state.card.url}" alt="Мем" title="Нажми, чтобы увеличить"><h2>${r.isImposter?'🎭 Это подстава!':'🫵 Это мем участника '+escapeHTML(r.ownerName)}</h2>${state.settings.shame&&!r.isImposter?'<p>А теперь автор может объяснить, почему это хранится в его телефоне.</p>':''}</section><section class="panel"><h2>📊 Голоса</h2>${r.details.length?r.details.map(v=>`<div class="result"><strong>${escapeHTML(v.name)}</strong> → ${escapeHTML(v.choice==='nobody'?'Никто':state.players.find(p=>p.id===v.choice)?.name||'?')} ${v.stake?'🎲':''}${state.mode!=='who'?` <b>(${v.change>=0?'+':''}${v.change})</b>`:''}</div>`).join(''):'<p>Голосов не было.</p>'}${scoreDetails(r)}<h2>🏆 Счёт</h2>${[...state.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="row result"><span>${escapeHTML(p.name)}</span><b>${p.score}</b></div>`).join('')}${state.isHost?'<button id="next">➡️ Следующий мем</button>':'<p>Ждём следующего мема.</p>'}</section></div>${historyBlock()}`;controls();viewerBindings();document.querySelector('#next')?.addEventListener('click',()=>act('next'));}
function done(){app.innerHTML=header()+`<section class="panel center"><div style="font-size:55px">🏆</div><h2>Мемный суд окончен</h2><p>Победитель определяется по набранным очкам.</p>${[...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="result" style="font-size:22px">${['🥇','🥈','🥉','🏅','🏅'][i]} ${escapeHTML(p.name)} — <b>${p.score}</b></div>`).join('')}<p>Хочешь ещё один раунд с теми же мемами?</p>${state.isHost?'<button id="replay">🔁 Сыграть ещё раз</button>':''}<button class="secondary" id="leave">Создать новую комнату</button></section>${historyBlock()}`;controls();document.querySelector('#replay')?.addEventListener('click',()=>{if(confirm('Начать новую партию? Очки сбросятся, мемы сохранятся.'))act('replay')});document.querySelector('#leave').onclick=()=>{localStorage.removeItem('memeSession');location.href='/'};}
function render(){if(!state)return renderHome();if(state.phase==='lobby')return lobby();if(state.phase==='playing')return play();if(state.phase==='reveal')return reveal();if(state.phase==='done')return done();}renderHome();
</script></body></html>
